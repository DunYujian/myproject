<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · 炖鱼尖的博客</title>
  <meta name="robots" content="noindex">

  <!--
    注意：404 页可能被 GitHub Pages 在任意层级的错误 URL 上展示，
    所以这里的资源与链接统一用「站点根路径」，不能写相对路径。
    自定义域名部署在根目录，资源与链接统一从 / 开始。
  -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>

<body data-page="404">
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="/index.html">
        <span class="brand__mark" aria-hidden="true">M</span>
        <span>炖鱼尖的博客</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="/index.html" data-nav="home">首页</a>
        <a href="/posts/index.html" data-nav="posts">文章</a>
        <a href="/about.html" data-nav="about">关于</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="not-found">
      <div class="wrap">
        <div class="code" aria-hidden="true">404</div>
        <h1>这一页不存在</h1>
        <p>可能是链接写错了，也可能是这篇文章已经搬走或者还没写出来。</p>
        <div class="hero__actions" style="justify-content:center">
          <a class="btn btn--primary" href="/index.html">回到首页</a>
          <a class="btn btn--ghost" href="/posts/index.html">浏览文章</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p style="margin:0">© <span data-year>2026</span> 炖鱼尖的博客</p>
      <nav class="footer-links" aria-label="页脚导航">
        <a href="/posts/index.html">文章</a>
        <a href="/about.html">关于</a>
      </nav>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
