<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f6">
  <title>页面不存在 · 再也的博客</title>
  <meta name="robots" content="noindex">

  <!--
    注意：404 页可能被 GitHub Pages 在任意层级的错误 URL 上展示，
    所以这里的资源与链接统一用「站点根路径」，不能写相对路径。
    自定义域名部署在根目录，资源与链接统一从 / 开始。
  -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/reading.css?v=20261019-1">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>

<body data-page="404">
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" aria-label="再也的博客首页" href="/index.html">
        <span>再也的博客</span>
      </a>

      <button class="icon-btn theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
        </svg>
        <span class="theme-toggle__label">深色</span>
      </button>

      <button class="icon-btn nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
      </button>

      <nav class="nav" id="nav" aria-label="主导航">
        <a href="/index.html" data-nav="home">首页</a>
        <a href="/posts/index.html" data-nav="posts">文章</a>
        <a href="/about.html" data-nav="about">关于</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="not-found">
      <div class="wrap">
        <div class="code" aria-hidden="true">404</div>
        <h1>这一页不存在</h1>
        <p>可能是链接写错了，也可能是这篇文章已经搬走或者还没写出来。</p>
        <div class="hero__actions" style="justify-content:center">
          <a class="btn btn--primary" href="/index.html">回到首页</a>
          <a class="btn btn--ghost" href="/posts/index.html">浏览文章</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p style="margin:0">© <span data-year>2026</span> 再也的博客</p>
      <nav class="footer-links" aria-label="页脚导航">
        <a href="/posts/index.html">文章</a>
        <a href="/about.html">关于</a>
      </nav>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
