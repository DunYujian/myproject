<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日程管理 · 再也的小站</title>
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../assets/css/portal.css">
<script defer src="../assets/js/planner.js"></script>
<body data-planner="schedule">
<main class="workspace">
<nav class="workspace-nav" aria-label="工作区导航"><a href="../">← 小站入口</a><a href="../projects/">项目管理 →</a></nav>
<h1>日程管理</h1>
<p class="intro">记录仅保存在当前浏览器，不会跨设备同步。</p>
<section class="panel" aria-labelledby="form-title">
<h2 id="form-title">新增日程</h2>
<form>
<label>日程名称<input name="title" maxlength="100" required></label>
<div class="fields"><label>日期<input name="date" type="date" required></label><label>时间<input name="time" type="time"></label></div>
<label>备注<textarea name="notes" rows="3" maxlength="1000"></textarea></label>
<div class="actions"><button type="submit">保存日程</button><button type="button" data-cancel hidden>取消编辑</button></div>
</form>
<noscript><p>请启用 JavaScript 后使用管理功能。</p></noscript>
</section>
<p role="status" data-message></p>
<section aria-labelledby="records-title"><h2 id="records-title">我的日程</h2><ul class="records" data-records></ul></section>
</main>
</body>
</html>
