    <section aria-labelledby="game-title" class="game-panel" id="snake-panel" role="region">

<p class="game-instructions">吃到金色圆点得 10 分，别撞到边界或自己。点击开始后，用方向键 / WASD、手机滑动或方向按钮移动；空格键暂停。</p>
<div class="game-stats"><span>得分 <strong id="snake-score">0</strong></span><span>本机最高 <strong id="snake-best">0</strong></span></div>
<div class="snake-layout">
<div class="snake-board">
<canvas aria-label="贪吃蛇棋盘，聚焦后可用方向键或 WASD 操作，空格键暂停" height="400" id="snake-board" role="img" tabindex="0" width="400">浏览器需要支持 Canvas 才能显示贪吃蛇。</canvas>
<div class="game-overlay" hidden="" id="snake-overlay"><strong>本局结束</strong><span>点击「再玩一次」，开始新的一局。</span></div>
</div>
<div class="snake-controls">
<div class="game-toolbar"><button class="game-button game-button--primary" id="snake-start" type="button">开始游戏</button><button class="game-button" id="snake-restart" type="button">重新开始</button></div>
<label class="game-speed" for="snake-speed">速度<select id="snake-speed"><option value="230">慢速 · 慢慢来</option><option selected="" value="170">标准 · 刚刚好</option><option value="110">快速 · 试试看</option></select></label>
<div aria-label="贪吃蛇方向控制" class="direction-pad" role="group"><button aria-label="向上" data-direction="up" type="button">↑</button><button aria-label="向左" data-direction="left" type="button">←</button><button aria-label="向下" data-direction="down" type="button">↓</button><button aria-label="向右" data-direction="right" type="button">→</button></div>
</div>
</div>
<p aria-live="polite" class="game-status" id="snake-status" role="status">准备好了，点击开始游戏。</p>
</section>
    <p class="games-note">无需账号，支持电脑和手机。离开页面后本局会重置。</p>
